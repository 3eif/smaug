<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smaug Archive</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050505;
        --ink: #f5f5f5;
        --muted: #8b8b8b;
        --line: rgba(255, 255, 255, 0.12);
        --soft: rgba(255, 255, 255, 0.05);
        --rail: rgba(5, 5, 5, 0.82);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
        letter-spacing: 0;
      }

      button,
      input {
        font: inherit;
      }

      button {
        color: inherit;
      }

      .app {
        position: relative;
        width: 100vw;
        height: 100vh;
        background:
          linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px),
          #050505;
        background-size: 48px 48px;
      }

      .sidebar {
        position: fixed;
        z-index: 10;
        left: 24px;
        top: 24px;
        bottom: 24px;
        width: 224px;
        padding: 18px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--rail);
        backdrop-filter: blur(18px);
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .brand {
        display: grid;
        gap: 5px;
      }

      .brand h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }

      .brand p,
      .status,
      .empty,
      .hint {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
      }

      .search {
        width: 100%;
        height: 34px;
        border: 0;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        outline: 0;
        background: transparent;
        color: var(--ink);
      }

      .search::placeholder {
        color: #666;
      }

      .categories {
        display: grid;
        gap: 2px;
        overflow: auto;
        padding-right: 2px;
      }

      .category {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 32px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        text-align: left;
        cursor: pointer;
        padding: 0 8px;
        transition: color 160ms ease, background 160ms ease;
      }

      .category:hover,
      .category.active {
        background: var(--soft);
        color: var(--ink);
      }

      .category span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .count {
        color: #777;
        font-size: 11px;
      }

      .canvas-head {
        position: fixed;
        z-index: 4;
        left: 288px;
        right: 28px;
        top: 26px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 18px;
        pointer-events: none;
      }

      .canvas-title {
        margin: 0;
        font-size: clamp(28px, 5vw, 72px);
        line-height: 0.9;
        font-weight: 600;
        letter-spacing: 0;
      }

      .canvas-meta {
        margin: 7px 0 0;
        max-width: 420px;
        color: var(--muted);
      }

      .tools {
        pointer-events: auto;
        display: flex;
        gap: 6px;
      }

      .tool {
        width: 34px;
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.3);
        cursor: pointer;
        transition: background 160ms ease, transform 160ms ease;
      }

      .tool:hover {
        background: var(--soft);
        transform: translateY(-1px);
      }

      .canvas {
        position: absolute;
        inset: 0 0 0 260px;
        overflow: auto;
        padding: 150px 40px 80px 28px;
        overscroll-behavior: contain;
      }

      .stage {
        position: relative;
        min-width: 900px;
        min-height: 640px;
      }

      .tweet {
        position: absolute;
        width: 300px;
        height: 152px;
        padding: 13px 14px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.028);
        cursor: grab;
        user-select: none;
        touch-action: none;
        overflow: hidden;
        transform: translate3d(var(--x), var(--y), 0);
        transition: opacity 220ms ease, border-color 160ms ease, background 160ms ease, transform 220ms ease;
        animation: enter 360ms ease both;
      }

      .tweet:active {
        cursor: grabbing;
      }

      .tweet:hover,
      .tweet.focused {
        border-color: rgba(255, 255, 255, 0.32);
        background: rgba(255, 255, 255, 0.07);
      }

      .tweet-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: baseline;
        margin-bottom: 9px;
      }

      .author {
        font-weight: 600;
      }

      .date {
        color: #777;
        font-size: 11px;
        white-space: nowrap;
      }

      .title {
        margin: 0 0 8px;
        font-size: 15px;
        line-height: 1.18;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .what {
        margin: 0;
        color: #b8b8b8;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .tweet a {
        display: inline-block;
        margin-top: 12px;
        color: var(--ink);
        text-decoration: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.35);
      }

      .empty {
        position: fixed;
        left: 288px;
        top: 50%;
        transform: translateY(-50%);
      }

      @keyframes enter {
        from {
          opacity: 0;
          transform: translate3d(var(--x), calc(var(--y) + 16px), 0);
        }
        to {
          opacity: 1;
          transform: translate3d(var(--x), var(--y), 0);
        }
      }

      @media (max-width: 760px) {
        body {
          overflow: auto;
          height: auto;
          min-height: 100vh;
        }

        .app {
          min-height: 100vh;
          height: auto;
          padding: 16px;
        }

        .sidebar,
        .canvas-head,
        .canvas,
        .empty {
          position: static;
        }

        .sidebar {
          width: auto;
          height: auto;
          margin-bottom: 26px;
        }

        .canvas-head {
          display: block;
          margin-bottom: 18px;
        }

        .tools {
          margin-top: 14px;
        }

        .canvas {
          display: grid;
          gap: 10px;
          overflow: visible;
          padding: 0;
        }

        .stage {
          display: grid;
          gap: 10px;
          min-width: 0;
          min-height: 0;
        }

        .tweet {
          position: static;
          width: 100%;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <aside class="sidebar">
        <div class="brand">
          <h1>Smaug</h1>
          <p id="status">Loading archive</p>
        </div>
        <input id="search" class="search" type="search" placeholder="Search" autocomplete="off" />
        <nav id="categories" class="categories" aria-label="Categories"></nav>
        <p class="hint">Drag tweets around. Click a category to redraw the canvas.</p>
      </aside>

      <header class="canvas-head">
        <div>
          <h2 id="title" class="canvas-title">Archive</h2>
          <p id="meta" class="canvas-meta"></p>
        </div>
        <div class="tools" aria-label="Canvas controls">
          <button id="shuffle" class="tool" type="button" title="Reflow">R</button>
          <button id="clear" class="tool" type="button" title="Clear positions">C</button>
        </div>
      </header>

      <section id="canvas" class="canvas" aria-label="Tweet canvas">
        <div id="stage" class="stage"></div>
      </section>
      <p id="empty" class="empty" hidden>No tweets match this view.</p>
    </main>

    <script>
      const state = {
        all: [],
        categories: [],
        active: "All",
        query: "",
        positions: new Map(),
        drag: null
      };

      const els = {
        status: document.getElementById("status"),
        categories: document.getElementById("categories"),
        search: document.getElementById("search"),
        canvas: document.getElementById("canvas"),
        title: document.getElementById("title"),
        meta: document.getElementById("meta"),
        empty: document.getElementById("empty"),
        stage: document.getElementById("stage"),
        shuffle: document.getElementById("shuffle"),
        clear: document.getElementById("clear")
      };

      init().catch((error) => {
        els.status.textContent = error.message;
      });

      async function init() {
        const response = await fetch("/data");
        if (!response.ok) throw new Error("Archive unavailable");
        const data = await response.json();

        state.all = data.bookmarks || [];
        state.categories = [{ name: "All", count: data.count || state.all.length }, ...(data.categories || [])];

        els.status.textContent = `${state.all.length.toLocaleString()} tweets`;
        els.search.addEventListener("input", () => {
          state.query = els.search.value.trim().toLowerCase();
          renderCanvas();
        });
        els.shuffle.addEventListener("click", () => {
          state.positions.clear();
          renderCanvas();
        });
        els.clear.addEventListener("click", () => {
          state.positions.clear();
          localStorage.removeItem("smaug-canvas-positions");
          renderCanvas();
        });

        loadPositions();
        renderCategories();
        renderCanvas();
      }

      function renderCategories() {
        els.categories.innerHTML = "";
        for (const category of state.categories) {
          const button = document.createElement("button");
          button.className = `category${category.name === state.active ? " active" : ""}`;
          button.type = "button";
          button.innerHTML = `<span>${escapeHtml(category.name)}</span><span class="count">${category.count}</span>`;
          button.addEventListener("click", () => {
        state.active = category.name;
        state.positions.clear();
        els.canvas.scrollTo({ top: 0, left: 0, behavior: "smooth" });
        renderCategories();
        renderCanvas();
          });
          els.categories.appendChild(button);
        }
      }

      function currentItems() {
        const query = state.query;
        return state.all
          .filter((item) => state.active === "All" || item.section === state.active)
          .filter((item) => {
            if (!query) return true;
            return `${item.author} ${item.title} ${item.what} ${item.text} ${item.date}`.toLowerCase().includes(query);
          });
      }

      function renderCanvas() {
        const items = currentItems();
        const visible = items;
        els.title.textContent = state.active;
        els.meta.textContent = `${items.length.toLocaleString()} in view`;
        els.empty.hidden = visible.length > 0;
        els.stage.innerHTML = "";
        setStageSize(visible.length);

        visible.forEach((item, index) => {
          const pos = getPosition(item, index);
          const node = document.createElement("article");
          node.className = "tweet";
          node.style.setProperty("--x", `${pos.x}px`);
          node.style.setProperty("--y", `${pos.y}px`);
          node.dataset.id = item.id;
          node.innerHTML = `
            <div class="tweet-head">
              <span class="author">@${escapeHtml(item.author)}</span>
              <span class="date">${escapeHtml(shortDate(item.date))}</span>
            </div>
            <p class="title">${escapeHtml(item.title)}</p>
            <p class="what">${escapeHtml(item.what || item.text || "Saved tweet")}</p>
            ${item.tweet ? `<a href="${escapeAttr(item.tweet)}" target="_blank" rel="noreferrer">open</a>` : ""}
          `;
          node.addEventListener("pointerdown", (event) => startDrag(event, node, item.id));
          node.addEventListener("mousedown", (event) => startMouseDrag(event, node, item.id));
          els.stage.appendChild(node);
        });
      }

      function setStageSize(count) {
        if (window.innerWidth < 760) return;
        const cols = columnCount();
        const rows = Math.max(1, Math.ceil(count / cols));
        els.stage.style.width = `${cols * 340}px`;
        els.stage.style.height = `${rows * 178 + 40}px`;
      }

      function getPosition(item, index) {
        const saved = state.positions.get(item.id);
        if (saved) return saved;
        const cols = columnCount();
        const col = index % cols;
        const row = Math.floor(index / cols);
        const x = col * 340 + ((row % 2) * 18);
        const y = row * 178 + ((col % 2) * 12);
        return { x, y };
      }

      function columnCount() {
        if (window.innerWidth < 900) return 2;
        if (window.innerWidth < 1200) return 3;
        return 4;
      }

      function startDrag(event, node, id) {
        if (window.innerWidth < 760) return;
        const current = state.positions.get(id) || {
          x: parseFloat(node.style.getPropertyValue("--x")) || 0,
          y: parseFloat(node.style.getPropertyValue("--y")) || 0
        };
        state.drag = {
          id,
          node,
          startX: event.clientX,
          startY: event.clientY,
          x: current.x,
          y: current.y
        };
        node.classList.add("focused");
        node.setPointerCapture(event.pointerId);
        node.addEventListener("pointermove", dragMove);
        node.addEventListener("pointerup", dragEnd, { once: true });
      }

      function startMouseDrag(event, node, id) {
        if (window.innerWidth < 760 || state.drag) return;
        event.preventDefault();
        const current = state.positions.get(id) || {
          x: parseFloat(node.style.getPropertyValue("--x")) || 0,
          y: parseFloat(node.style.getPropertyValue("--y")) || 0
        };
        state.drag = {
          id,
          node,
          startX: event.clientX,
          startY: event.clientY,
          x: current.x,
          y: current.y
        };
        node.classList.add("focused");
        window.addEventListener("mousemove", dragMove);
        window.addEventListener("mouseup", dragEnd, { once: true });
      }

      function dragMove(event) {
        const drag = state.drag;
        if (!drag) return;
        const x = drag.x + event.clientX - drag.startX;
        const y = drag.y + event.clientY - drag.startY;
        drag.node.style.setProperty("--x", `${x}px`);
        drag.node.style.setProperty("--y", `${y}px`);
      }

      function dragEnd(event) {
        const drag = state.drag;
        if (!drag) return;
        const x = drag.x + event.clientX - drag.startX;
        const y = drag.y + event.clientY - drag.startY;
        state.positions.set(drag.id, { x, y });
        savePositions();
        drag.node.classList.remove("focused");
        drag.node.removeEventListener("pointermove", dragMove);
        window.removeEventListener("mousemove", dragMove);
        state.drag = null;
      }

      function savePositions() {
        localStorage.setItem("smaug-canvas-positions", JSON.stringify([...state.positions.entries()]));
      }

      function loadPositions() {
        try {
          state.positions = new Map(JSON.parse(localStorage.getItem("smaug-canvas-positions") || "[]"));
        } catch {
          state.positions = new Map();
        }
      }

      function shortDate(date) {
        return String(date || "").replace(/^[A-Za-z]+,\s*/, "").replace(/,\s*\d{4}$/, "");
      }

      function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        })[char]);
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, "&#096;");
      }
    </script>
  </body>
</html>
