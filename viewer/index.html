<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smaug Archive</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050505;
        --ink: #f5f5f5;
        --muted: #8b8b8b;
        --line: rgba(255, 255, 255, 0.12);
        --soft: rgba(255, 255, 255, 0.05);
        --rail: rgba(5, 5, 5, 0.82);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
        letter-spacing: 0;
      }

      button,
      input {
        font: inherit;
      }

      button {
        color: inherit;
      }

      .app {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: #050505;
      }

      .sidebar {
        position: fixed;
        z-index: 10;
        left: 24px;
        top: 24px;
        bottom: 24px;
        width: 224px;
        padding: 18px 14px;
        border: 1px solid var(--line);
        border-radius: 0;
        background: var(--rail);
        backdrop-filter: blur(18px);
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .brand {
        display: grid;
        gap: 5px;
      }

      .brand h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }

      .brand p,
      .status,
      .empty,
      .hint {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
      }

      .search {
        width: 100%;
        height: 34px;
        border: 0;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        outline: 0;
        background: transparent;
        color: var(--ink);
      }

      .search::placeholder {
        color: #666;
      }

      .categories {
        display: grid;
        gap: 2px;
        overflow: auto;
        padding-right: 2px;
      }

      .category {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 32px;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--muted);
        text-align: left;
        cursor: pointer;
        padding: 0 8px;
        transition: color 160ms ease, background 160ms ease;
      }

      .category:hover,
      .category.active {
        background: var(--soft);
        color: var(--ink);
      }

      .category span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .count {
        color: #777;
        font-size: 11px;
      }

      .canvas-head {
        position: fixed;
        z-index: 4;
        left: 288px;
        right: 28px;
        top: 26px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 18px;
        pointer-events: none;
      }

      .canvas-title {
        margin: 0;
        font-size: clamp(22px, 3vw, 42px);
        line-height: 1;
        font-weight: 600;
        letter-spacing: 0;
      }

      .canvas-meta {
        margin: 7px 0 0;
        max-width: 420px;
        color: var(--muted);
      }

      .tools {
        pointer-events: auto;
        display: flex;
        gap: 6px;
      }

      .tool {
        min-width: 34px;
        height: 34px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 0;
        background: rgba(0, 0, 0, 0.3);
        color: var(--muted);
        cursor: pointer;
        transition: background 160ms ease, transform 160ms ease;
      }

      .tool:hover {
        background: var(--soft);
        transform: translateY(-1px);
      }

      .tool.active {
        background: var(--soft);
        color: var(--ink);
      }

      .canvas {
        position: absolute;
        inset: 0 0 0 260px;
        overflow: auto;
        padding: 150px 40px 80px 28px;
        overscroll-behavior: contain;
      }

      .stage {
        display: grid;
        align-items: start;
        min-width: 0;
      }

      .stage.grid {
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 26px;
        width: max(100%, 660px);
      }

      .stage.row {
        grid-template-columns: minmax(0, 620px);
        gap: 18px;
        width: min(620px, 100%);
      }

      .tweet {
        width: 100%;
        min-width: 0;
        padding: 13px 14px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 0;
        background: rgba(255, 255, 255, 0.028);
        user-select: text;
        overflow: visible;
        transition: opacity 220ms ease, border-color 160ms ease, background 160ms ease;
        animation: enter 360ms ease both;
      }

      .tweet:hover,
      .tweet.focused {
        border-color: rgba(255, 255, 255, 0.32);
        background: rgba(255, 255, 255, 0.07);
      }

      .tweet-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: baseline;
        margin-bottom: 9px;
      }

      .media-thumb {
        display: block;
        width: 100%;
        height: auto;
        max-height: none;
        margin: 0 0 12px;
        border: 0;
        object-fit: contain;
        background: #0b0b0b;
      }

      .media-stack {
        display: grid;
        gap: 8px;
        margin-bottom: 12px;
      }

      .media-stack .media-thumb {
        margin: 0;
      }

      .author {
        font-weight: 600;
      }

      .date {
        color: #777;
        font-size: 11px;
        white-space: nowrap;
      }

      .title {
        margin: 0 0 7px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.3;
        font-weight: 400;
      }

      .what {
        margin: 0;
        color: #e5e5e5;
        font-size: 13px;
        line-height: 1.42;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .tweet a {
        display: inline-block;
        margin-top: 10px;
        color: var(--ink);
        text-decoration: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.35);
      }

      .empty {
        position: fixed;
        left: 288px;
        top: 50%;
        transform: translateY(-50%);
      }

      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 560px) {
        body {
          overflow: auto;
          height: auto;
          min-height: 100vh;
        }

        .app {
          min-height: 100vh;
          height: auto;
          padding: 16px;
        }

        .sidebar,
        .canvas-head,
        .canvas,
        .empty {
          position: static;
        }

        .sidebar {
          width: auto;
          height: auto;
          margin-bottom: 26px;
        }

        .canvas-head {
          display: block;
          margin-bottom: 18px;
        }

        .tools {
          margin-top: 14px;
        }

        .canvas {
          display: grid;
          gap: 10px;
          overflow: visible;
          padding: 0;
        }

        .stage,
        .stage.grid,
        .stage.row {
          grid-template-columns: minmax(0, 1fr);
          gap: 12px;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <aside class="sidebar">
        <div class="brand">
          <h1>Smaug</h1>
          <p id="status">Loading archive</p>
        </div>
        <input id="search" class="search" type="search" placeholder="Search" autocomplete="off" />
        <nav id="categories" class="categories" aria-label="Categories"></nav>
        <p class="hint">Click a category, then switch between grid and row views.</p>
      </aside>

      <header class="canvas-head">
        <div>
          <h2 id="title" class="canvas-title">Archive</h2>
          <p id="meta" class="canvas-meta"></p>
        </div>
        <div class="tools" aria-label="Canvas controls">
          <button id="grid" class="tool active" type="button" title="Grid view">Grid</button>
          <button id="row" class="tool" type="button" title="Row view">Row</button>
        </div>
      </header>

      <section id="canvas" class="canvas" aria-label="Tweet canvas">
        <div id="stage" class="stage"></div>
      </section>
      <p id="empty" class="empty" hidden>No tweets match this view.</p>
    </main>

    <script>
      const MODE_KEY = "smaug-view-mode";

      const state = {
        all: [],
        categories: [],
        active: "All",
        query: "",
        mode: localStorage.getItem(MODE_KEY) === "row" ? "row" : "grid"
      };

      const els = {
        status: document.getElementById("status"),
        categories: document.getElementById("categories"),
        search: document.getElementById("search"),
        canvas: document.getElementById("canvas"),
        title: document.getElementById("title"),
        meta: document.getElementById("meta"),
        empty: document.getElementById("empty"),
        stage: document.getElementById("stage"),
        grid: document.getElementById("grid"),
        row: document.getElementById("row")
      };

      init().catch((error) => {
        els.status.textContent = error.message;
      });

      async function init() {
        const response = await fetch("/data");
        if (!response.ok) throw new Error("Archive unavailable");
        const data = await response.json();

        state.all = data.bookmarks || [];
        state.categories = [{ name: "All", count: data.count || state.all.length }, ...(data.categories || [])];

        els.status.textContent = `${state.all.length.toLocaleString()} tweets`;
        els.search.addEventListener("input", () => {
          state.query = els.search.value.trim().toLowerCase();
          renderCanvas();
        });
        els.grid.addEventListener("click", () => setMode("grid"));
        els.row.addEventListener("click", () => setMode("row"));

        renderModeTools();
        renderCategories();
        renderCanvas();
      }

      function setMode(mode) {
        state.mode = mode;
        localStorage.setItem(MODE_KEY, mode);
        els.canvas.scrollTo({ top: 0, left: 0, behavior: "smooth" });
        renderModeTools();
        renderCanvas();
      }

      function renderModeTools() {
        els.grid.classList.toggle("active", state.mode === "grid");
        els.row.classList.toggle("active", state.mode === "row");
      }

      function renderCategories() {
        els.categories.innerHTML = "";
        for (const category of state.categories) {
          const button = document.createElement("button");
          button.className = `category${category.name === state.active ? " active" : ""}`;
          button.type = "button";
          button.innerHTML = `<span>${escapeHtml(category.name)}</span><span class="count">${category.count}</span>`;
          button.addEventListener("click", () => {
            state.active = category.name;
            els.canvas.scrollTo({ top: 0, left: 0, behavior: "smooth" });
            renderCategories();
            renderCanvas();
          });
          els.categories.appendChild(button);
        }
      }

      function currentItems() {
        const query = state.query;
        return state.all
          .filter((item) => state.active === "All" || item.section === state.active)
          .filter((item) => {
            if (!query) return true;
            return `${item.author} ${item.title} ${item.what} ${item.text} ${item.date}`.toLowerCase().includes(query);
          });
      }

      function renderCanvas() {
        const items = currentItems();
        const visible = items;
        els.title.textContent = state.active;
        els.meta.textContent = `${items.length.toLocaleString()} in view`;
        els.empty.hidden = visible.length > 0;
        els.stage.innerHTML = "";
        els.stage.className = `stage ${state.mode}`;

        visible.forEach((item) => {
          const media = Array.isArray(item.media) ? item.media : [];
          const node = document.createElement("article");
          node.className = `tweet${media.length ? " has-media" : ""}`;
          node.dataset.id = item.id;
          node.innerHTML = `
            ${media.length ? `<div class="media-stack">${media.map((src) => `<img class="media-thumb" src="${escapeAttr(src)}" alt="" loading="lazy" decoding="async">`).join("")}</div>` : ""}
            <div class="tweet-head">
              <span class="author">@${escapeHtml(item.author)}</span>
              <span class="date">${escapeHtml(shortDate(item.date))}</span>
            </div>
            <p class="title">${escapeHtml(item.title)}</p>
            <p class="what">${escapeHtml(item.text || item.what || "Saved tweet")}</p>
            ${item.tweet ? `<a href="${escapeAttr(item.tweet)}" target="_blank" rel="noreferrer">open</a>` : ""}
          `;
          els.stage.appendChild(node);
        });
      }

      function shortDate(date) {
        return String(date || "").replace(/^[A-Za-z]+,\s*/, "").replace(/,\s*\d{4}$/, "");
      }

      function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        })[char]);
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, "&#096;");
      }
    </script>
  </body>
</html>
